name: Démo GitHub Actions

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  demo:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Vérifier la présence du README
        run: |
          if [ -f README.md ]; then
            echo "Le fichier README.md existe."
          else
            echo "Le fichier README.md est absent."
            exit 1
          fi
